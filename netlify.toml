# Netlify configuration for questions.richallen.info
# Build: Astro static output to dist/. No functions, no server runtime.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Playwright is only used for local image generation/QA; skip its browser download on Netlify.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Question pages are built as /flow.html etc. Netlify serves them at /flow
# automatically. Trailing-slash variants (/flow/) are normalised to the
# canonical URL by dist/_redirects, which Astro generates from the content
# collection at build time (see src/pages/_redirects.ts).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Allow self + the optional analytics providers (only one is ever loaded).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io https://cloud.umami.is https://gc.zgo.at; connect-src 'self' https://plausible.io https://cloud.umami.is https://*.goatcounter.com; img-src 'self' data: https://*.goatcounter.com; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
